<style id="splash-css">#splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#2b4fa0,#0b1638 70%);transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}#splash div{text-align:center;color:#fff;font:800 26px system-ui,-apple-system,sans-serif;letter-spacing:.02em}
#splash img{width:112px;height:112px;display:block;margin:0 auto 10px;animation:spB 1.1s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
#splash i{display:inline-block;width:8px;height:8px;margin:14px 4px 0;border-radius:50%;background:#ffd36b;animation:spD 1s infinite}#splash i:nth-child(3){animation-delay:.15s}#splash i:nth-child(4){animation-delay:.3s}
@keyframes spB{50%{transform:translateY(-10px) scale(1.04,.97)}}@keyframes spD{50%{opacity:.25;transform:translateY(-4px)}}</style>
</head>
<body>
<div id="splash"><div><img src="../idiomas/assets/mochi.webp" alt="">Mochigo<br><i></i><i></i><i></i></div></div>
  <div id="app"></div>
  <script>(function(){var s=document.getElementById('splash'),a=document.getElementById('app'),t0=Date.now();
function done(){if(!s)return;s.classList.add('out');setTimeout(function(){s&&s.remove();s=null},400)}
var mo=new MutationObserver(function(){var x=a&&a.textContent.replace(/Cargando…|Loading…/g,'').trim();if(x){setTimeout(done,Math.max(0,450-(Date.now()-t0)));mo.disconnect()}});
a&&mo.observe(a,{childList:true,subtree:true,characterData:true});setTimeout(done,12000)})();</script>
