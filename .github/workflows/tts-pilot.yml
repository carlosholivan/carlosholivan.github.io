# Pilot of open-source TTS for the story characters: Qwen3-TTS (Apache-2.0) designs one synthetic voice per character
# and reads lines with it; Chatterbox Multilingual (MIT) reads the same lines cloned from that voice. Runs on the free
# CPU runners and uploads the clips as an artifact to compare by ear. Run by hand (workflow_dispatch).
name: tts-pilot
on: workflow_dispatch
jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults: { run: { working-directory: .github/tts/pilot } }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ".github/tts/pilot" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q qwen-tts soundfile
      - run: python qwen.py
      - uses: actions/upload-artifact@v4
        with: { name: qwen, path: .github/tts/pilot/out }
  chatterbox:
    needs: qwen
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults: { run: { working-directory: .github/tts/pilot } }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ".github/tts/pilot" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: qwen, path: .github/tts/pilot/out }
      - run: pip install -q chatterbox-tts
      - run: python chatter.py
      - uses: actions/upload-artifact@v4
        with: { name: pilot-audio, path: .github/tts/pilot/out }
