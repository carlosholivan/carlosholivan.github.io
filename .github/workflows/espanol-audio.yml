name: Spanish app audio (edge-tts)

# Generates the missing MP3s of espanol-app (new words, example sentences, extra sets, conjugations)
# with the free Microsoft Edge neural voices, commits them and redeploys the site.
on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "espanol-app/data/*/vocab.json"
      - "espanol-app/data/*/texts.json"
      - "espanol-app/data/*/examples.json"
      - "espanol-app/data/*/extra.json"
      - "espanol-app/data/*/drills.json"
      - "espanol-app/js/conj.js"

permissions:
  contents: write
  actions: write

concurrency:
  group: espanol-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install edge-tts
      - run: cd espanol-app && python tools/generate_audio.py --jobs 6
      - name: Commit new audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espanol-app/data/audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "espanol: generated audio"
          git pull --rebase origin master
          git push origin HEAD:master
          gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
