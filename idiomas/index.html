<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Idiomas</title>
<style>
  :root {
    --bg: #faf8f5; --bg2: #ffffff; --ink: #2b2722; --ink2: #6b6358; --line: #e8e2d9;
    --accent: #9c7842; --accent2: #876535; --soft: #f3ede4; --ok: #4d7d5e;
    --shadow: 0 1px 3px rgba(60,50,40,.06), 0 8px 24px rgba(60,50,40,.05);
    --serif: 'Hiragino Mincho ProN', 'Yu Mincho', 'Songti SC', 'Noto Serif CJK JP', Georgia, serif;
    --sans: -apple-system, 'SF Pro Text', system-ui, 'Hiragino Sans', 'PingFang SC', sans-serif;
  }
  html.dark {
      --bg: #16140f; --bg2: #1f1c16; --ink: #ece6db; --ink2: #9c9486; --line: #2c2820;
      --accent: #c9a86a; --accent2: #d8b97c; --soft: #221e17; --ok: #7faa8b;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 0 0 4px }
  .muted { color: var(--ink2) } .small { font-size: 14px }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow) }
  .sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 26px 2px 10px; font-weight: 700 }
  .progbar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden }
  .progfill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 6px; transition: width .6s cubic-bezier(.4,0,.2,1) }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 700 16px var(--sans); background: var(--accent); color: #fff; cursor: pointer; text-align: center; text-decoration: none }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line) }
  .btn:disabled { opacity: .45; cursor: default }
  /* language picker */
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 }
  .pick button { all: unset; box-sizing: border-box; cursor: pointer; padding: 16px 14px; display: flex; gap: 12px; align-items: center; position: relative }
  .pick button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset }
  .pick .tick { position: absolute; top: 8px; right: 10px; color: var(--accent); font-weight: 800; opacity: 0 }
  .pick button.on .tick { opacity: 1 }
  .glyph { font-family: var(--serif); font-size: 26px; width: 46px; height: 46px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; color: var(--accent2) }
  .lname { font-weight: 700 } .lsub { font-size: 13px; color: var(--ink2) }
  /* dashboard */
  .lang { padding: 18px; margin-bottom: 14px }
  .lang-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px }
  .lang-top .grow { flex: 1; min-width: 0 }
  .pct { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--accent2) }
  .stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink2); margin: 10px 0 12px; flex-wrap: wrap }
  .lvls { display: grid; gap: 5px; margin-bottom: 14px }
  .lvl { min-width: 0; text-align: center; padding: 8px 2px; border-radius: 12px; background: var(--soft); font-size: 11px }
  .lvl b { display: block; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .lvl.cur { box-shadow: 0 0 0 2px var(--accent) inset }
  .lvl .mini { height: 4px; background: var(--line); border-radius: 3px; margin-top: 5px; overflow: hidden }
  .lvl .mini i { display: block; height: 100%; background: var(--accent) }
  .row2 { display: flex; gap: 10px; margin-top: 18px }
  .row2 .btn { flex: 1 }
  .note { font-size: 13px; color: var(--ink2); text-align: center; margin-top: 18px; line-height: 1.5 }
  /* account */
  .auth { padding: 24px; margin-top: 18px }
  .auth label { display: block; font-size: 13px; color: var(--ink2); margin: 0 0 4px }
  .auth input { width: 100%; padding: 13px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: 16px var(--sans); margin-bottom: 12px; background: var(--bg); color: var(--ink) }
  .auth input:focus { outline: none; border-color: var(--accent) }
  .msg { display: none; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; background: #f6e3df; color: #9a3b2e }
  .msg.ok { background: #e3efe6; color: #2f6440 }
  html.dark .msg { background: #3a211c; color: #f0b3a7 } html.dark .msg.ok { background: #1d3324; color: #a8d4b4 }
  .links { text-align: center; margin-top: 14px; font-size: 14px }
  .links a, a.lnk { color: var(--accent); cursor: pointer; text-decoration: none }
  .alt { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink2) }
  .acct { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 13px; color: var(--ink2); margin-bottom: 18px }
  .acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .center { text-align: center }
  .big { font-size: 46px; margin-bottom: 6px }
</style>
  <script src="ico.js?v=2"></script>
  <script src="music.js?v=3"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Light by default; dark only when the learner turned dark mode on in one of the apps (Ajustes → Modo oscuro).
(function () {
  try {
    var dark = localStorage.getItem('idiomas_dark');
    if (dark === null) {
      dark = '0';
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/_state$/.test(k)) { try { if (JSON.parse(localStorage.getItem(k)).dark) dark = '1'; } catch (e) {} }
      }
    }
    if (dark === '1') { document.documentElement.classList.add('dark'); document.querySelector('meta[name=theme-color]').setAttribute('content', '#16140f'); }
  } catch (e) {}
})();
</script>
<script type="module">
// Hub for the language apps: the single place to sign in, then pick languages and see progress.
// Each app keeps its own index.html, state and data; they share the sign-in because they live on the
// same origin and use the same Firebase project. This page reads their progress (local + account).
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
  sendPasswordResetEmail, sendEmailVerification, reload } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import firebaseConfig from './firebase-config.js?v=1';

const APPS = [
  { id: 'english',  path: '../english-app/',  key: 'english_state',  field: 'english',  glyph: 'En', name: 'Inglés',  native: 'English',  levels: ['a1','a2','b1','b2','c1','c2'] },
  { id: 'francais', path: '../francais-app/', key: 'francais_state', field: 'francais', glyph: 'Fr', name: 'Francés', native: 'Français', levels: ['a1','a2','b1','b2','c1','c2'] },
  { id: 'deutsch',  path: '../deutsch-app/',  key: 'deutsch_state',  field: 'deutsch',  glyph: 'De', name: 'Alemán',  native: 'Deutsch',  levels: ['a1','a2','b1','b2','c1','c2'] },
  { id: 'nihongo',  path: '../nihongo-app/',  key: 'nihongo_state', field: 'nihongo',  glyph: '日', name: 'Japonés', native: '日本語',    levels: ['n5','n4','n3','n2','n1'] },
  { id: 'chino',    path: '../chino-app/',    key: 'chino_state',    field: 'chino',    glyph: '中', name: 'Chino',   native: '中文',      levels: ['hsk1','hsk2','hsk3','hsk4','hsk5','hsk6','hsk7'] },
  { id: 'arabic',   path: '../arabic-app/',   key: 'arabe_state',    field: 'arabe',    glyph: 'ع', name: 'Árabe',   native: 'العربية',   levels: ['a1','a2','b1','b2','c1','c2'] },
  { id: 'espanol',  path: '../espanol-app/',  key: 'español_state',  field: 'espanol',  glyph: 'Es', name: 'Español', native: 'Español',  levels: ['a1','a2','b1','b2','c1','c2'] },
];
const PREF = 'idiomas_hub_langs', GUEST = 'idiomas_guest';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const del = k => { try { localStorage.removeItem(k); } catch (e) {} };
const label = l => /^hsk/.test(l) ? 'HSK ' + (l === 'hsk7' ? '7–9' : l.slice(3)) : l.toUpperCase();
const short = l => /^hsk/.test(l) ? (l === 'hsk7' ? '7–9' : l.slice(3)) : l.toUpperCase();
const bar = p => `<div class="progbar"><div class="progfill" style="width:${Math.max(0, Math.min(100, p))}%"></div></div>`;

// Back to the app that sent the learner here (only paths of these apps are accepted).
const next = (() => {
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^\/(?:[\w.-]+\/)*[\w-]+-app\/[\w\-\/.]*$/.test(n) && APPS.some(a => n.includes(a.path.slice(2))) ? n : null;
})();

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
auth.languageCode = 'es';
const db = getFirestore(fb);
let user = null;
let cloud = {};   // users/{uid}: one field per app + 'hub'

let chosen;
try { chosen = JSON.parse(get(PREF) || 'null'); } catch (e) { chosen = null; }

// Progress of one app: what this device has, completed with what the account has.
function stateOf(a) {
  let loc = null;
  try { loc = JSON.parse(get(a.key) || 'null'); } catch (e) {}
  if (loc && user && loc.uid && loc.uid !== user.uid) loc = null;
  const c = cloud[a.field] || (a.field === 'espanol' && cloud.completed ? cloud : null);
  if (!loc && !c) return null;
  if (!loc || !c) return loc || c;
  return {
    completed: { ...(c.completed || {}), ...(loc.completed || {}) },
    xp: Math.max(loc.xp || 0, c.xp || 0),
    streak: Math.max(loc.streak || 0, c.streak || 0),
    level: loc.level || c.level,
    cards: loc.cards,
    lvp: { ...(c.lvp || {}), ...(loc.lvp || {}) },
  };
}
const started = a => { const s = stateOf(a); return !!(s && ((s.completed && Object.keys(s.completed).length) || s.xp || (s.cards && Object.keys(s.cards).length) || s.pack || Object.values(s.lvp || {}).some(v => v > 0))); };

// ---------- account ----------
const ERR = {
  'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
  'auth/invalid-email': 'El correo no es válido.',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
  'auth/user-not-found': 'No hay ninguna cuenta con ese correo.',
  'auth/wrong-password': 'Correo o contraseña incorrectos.',
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.',
  'auth/network-request-failed': 'Sin conexión. Revisa tu red.',
};
const errText = e => ERR[e && e.code] || (e && e.message) || 'Error';
function say(text, ok) { const m = $('#msg'); if (!m) return; m.className = 'msg' + (ok ? ' ok' : ''); m.style.display = 'block'; m.textContent = text; }
const isVerified = u => !!u && (u.emailVerified || !u.providerData.some(p => p.providerId === 'password'));
const verifyUrl = () => location.origin + location.pathname + (next ? '?next=' + encodeURIComponent(next) : '');

function authView(mode = 'login') {
  const reg = mode === 'register';
  $('#app').innerHTML = `
    <h1>Idiomas</h1>
    <div class="muted">${reg ? 'Crea tu cuenta: una sola para todos los idiomas.' : 'Inicia sesión una vez y estudia todos tus idiomas.'}</div>
    <form class="card auth" id="f" novalidate>
      <div id="msg" class="msg"></div>
      ${reg ? `<label for="nm">Tu nombre</label><input id="nm" type="text" maxlength="30" autocomplete="given-name" placeholder="Tu nombre">` : ''}
      <label for="em">Correo electrónico</label>
      <input id="em" type="email" autocomplete="email" placeholder="email@ejemplo.com">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="••••••••">
      <button class="btn" id="go" type="submit">${reg ? 'Crear cuenta' : 'Iniciar sesión'}</button>
      ${reg ? '' : '<div class="links"><a id="forgot">¿Has olvidado la contraseña?</a></div>'}
      <div class="alt">${reg ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?'} <a class="lnk" id="sw">${reg ? 'Iniciar sesión' : 'Crear cuenta'}</a></div>
    </form>
    <div class="links"><a id="guest" class="muted">Continuar sin cuenta</a></div>
    <div class="note">Sin cuenta, el progreso solo se guarda en este dispositivo.</div>`;
  $('#sw').onclick = () => authView(reg ? 'login' : 'register');
  $('#guest').onclick = () => { set(GUEST, '1'); if (next) location.replace(next); else flow(); };
  if (!reg) $('#forgot').onclick = async () => {
    const email = $('#em').value.trim();
    if (!email) return say('Escribe tu correo y vuelve a pulsar.');
    try { await sendPasswordResetEmail(auth, email); say('Te hemos enviado un correo para cambiar la contraseña.', true); }
    catch (e) { say(errText(e)); }
  };
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#em').value.trim(), pass = $('#pw').value, name = reg ? $('#nm').value.trim() : null;
    if (!email || !pass || name === '') return say('Rellena todos los campos.');
    if (pass.length < 6) return say('La contraseña debe tener al menos 6 caracteres.');
    const b = $('#go'); b.disabled = true; b.textContent = '…';
    try {
      if (reg) {
        set('idiomas_name', name);
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(cred.user, { url: verifyUrl() });
      } else await signInWithEmailAndPassword(auth, email, pass);
      // onAuthStateChanged takes it from here
    } catch (e) { b.disabled = false; b.textContent = reg ? 'Crear cuenta' : 'Iniciar sesión'; say(errText(e)); }
  };
}

function verifyView() {
  $('#app').innerHTML = `
    <div class="card auth center">
      <div class="big">✉️</div>
      <h1 style="font-size:24px">Confirma tu correo</h1>
      <p class="muted">Te hemos enviado un enlace a <b>${esc(user.email)}</b>. Ábrelo y vuelve aquí.</p>
      <div id="msg" class="msg"></div>
      <button class="btn" id="chk">Ya lo he confirmado</button>
      <button class="btn ghost" id="again" style="margin-top:10px">Reenviar el correo</button>
      <div class="links"><a id="out" class="muted">Cerrar sesión</a></div>
    </div>`;
  $('#chk').onclick = async () => { if (!(await checkVerified())) say('Todavía no consta como confirmado. Abre el enlace del correo.'); };
  $('#again').onclick = async ev => {
    ev.target.disabled = true;
    try { await sendEmailVerification(user, { url: verifyUrl() }); say('Correo reenviado.', true); } catch (e) { say(errText(e)); }
    setTimeout(() => { ev.target.disabled = false; }, 30000);
  };
  $('#out').onclick = () => signOut(auth);
}
async function checkVerified() {
  if (!user) return false;
  await reload(user);
  if (!user.emailVerified) return false;
  await user.getIdToken(true);
  signedIn();
  return true;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && user && !user.emailVerified) checkVerified().catch(() => {});
});

async function signedIn() {
  del(GUEST);
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    cloud = snap.exists() ? snap.data() : {};
  } catch (e) { cloud = {}; }
  const hub = cloud.hub && Array.isArray(cloud.hub.langs) ? cloud.hub.langs.filter(id => APPS.some(a => a.id === id)) : null;
  if (hub && hub.length) { chosen = hub; set(PREF, JSON.stringify(chosen)); }
  else if (chosen && chosen.length) saveChoice();
  else {   // signed in before but never picked here: the languages with progress in the account are the choice
    const had = APPS.filter(a => cloud[a.field] || started(a)).map(a => a.id);
    if (had.length) { chosen = had; set(PREF, JSON.stringify(chosen)); saveChoice(); }
  }
  if (next) return location.replace(next);
  flow();
}
function saveChoice() {
  if (!user || !isVerified(user)) return;
  setDoc(doc(db, 'users', user.uid), { hub: { langs: chosen, updatedAt: Date.now() } }, { mergeFields: ['hub'] }).catch(() => {});
}

onAuthStateChanged(auth, u => {
  user = u;
  if (!u) { cloud = {}; return get(GUEST) === '1' ? flow() : authView('login'); }
  if (!isVerified(u)) return verifyView();
  signedIn();
});

// ---------- languages ----------
// number of units per level (read once from each app's data, then cached for a day)
async function unitCounts(a) {
  const ck = 'idiomas_hub_units_' + a.id;
  try { const c = JSON.parse(get(ck) || 'null'); if (c && Date.now() - c.t < 864e5) return c.n; } catch (e) {}
  const n = {};
  await Promise.all(a.levels.map(async l => {
    try { const r = await fetch(`${a.path}data/${l}/units.json`); n[l] = r.ok ? (await r.json()).length : 0; } catch (e) { n[l] = 0; }
  }));
  set(ck, JSON.stringify({ t: Date.now(), n }));
  return n;
}

function flow() {
  if (!(chosen && chosen.length)) {   // languages already studied on this device count as chosen: no need to ask again
    const had = APPS.filter(started).map(a => a.id);
    if (had.length) { chosen = had; set(PREF, JSON.stringify(chosen)); saveChoice(); }
  }
  chosen && chosen.length ? dashboard() : picker(true);
}

function acctBar() {
  return user
    ? `<div class="acct"><span>👤 ${esc(user.email)}</span><a class="lnk" id="out">Cerrar sesión</a></div>`
    : `<div class="acct"><span>Sin cuenta · progreso solo en este dispositivo</span><a class="lnk" id="login">Iniciar sesión</a></div>`;
}
function bindAcct() {
  if ($('#out')) $('#out').onclick = () => signOut(auth);
  if ($('#login')) $('#login').onclick = () => { del(GUEST); authView('login'); };
}

function picker(first) {
  const sel = new Set(chosen || APPS.filter(started).map(a => a.id));
  $('#app').innerHTML = `${acctBar()}
    <h1>${first ? '¿Qué idiomas estudias?' : 'Tus idiomas'}</h1>
    <div class="muted">Elige uno o varios. Podrás cambiarlo cuando quieras.</div>
    <div class="pick">${APPS.map(a => `
      <button class="card ${sel.has(a.id) ? 'on' : ''}" data-id="${a.id}" aria-pressed="${sel.has(a.id)}">
        <span class="glyph">${esc(a.glyph)}</span>
        <span><div class="lname">${esc(a.name)}</div><div class="lsub">${esc(a.native)}</div></span>
        <span class="tick">✓</span>
      </button>`).join('')}</div>
    <button class="btn" id="ok" ${sel.size ? '' : 'disabled'}>Continuar</button>
    ${chosen && chosen.length ? '<button class="btn ghost" id="cancel" style="margin-top:10px">Cancelar</button>' : ''}`;
  bindAcct();
  document.querySelectorAll('.pick button').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    b.classList.toggle('on', sel.has(id)); b.setAttribute('aria-pressed', sel.has(id));
    $('#ok').disabled = !sel.size;
  });
  $('#ok').onclick = () => { chosen = APPS.map(a => a.id).filter(id => sel.has(id)); set(PREF, JSON.stringify(chosen)); saveChoice(); dashboard(); };
  if ($('#cancel')) $('#cancel').onclick = dashboard;
}

async function dashboard() {
  const list = APPS.filter(a => chosen.includes(a.id));
  $('#app').innerHTML = `${acctBar()}
    <h1>¿Qué idioma quieres estudiar hoy?</h1>
    <div class="muted">Tu progreso en cada idioma. Toca uno para entrar.</div>
    <div class="sec">Estudiando</div>
    <div id="langs">${list.map(a => `<div class="card lang" id="l-${a.id}"><div class="lang-top"><span class="glyph">${esc(a.glyph)}</span>
      <div class="grow"><div class="lname">${esc(a.name)}</div><div class="lsub">${esc(a.native)}</div></div></div>${bar(0)}</div>`).join('')}</div>
    <div class="row2"><button class="btn ghost" id="edit">Cambiar idiomas</button></div>
    <div class="note">Cada idioma es una app independiente con su propio progreso.<br>${user ? 'El progreso se guarda en tu cuenta.' : 'Aquí se muestra el progreso guardado en este dispositivo.'}</div>`;
  bindAcct();
  $('#edit').onclick = () => picker(false);
  for (const a of list) render(a);
}

async function render(a) {
  const s = stateOf(a) || {};
  const done = s.completed || {};
  const n = await unitCounts(a);
  const total = a.levels.reduce((t, l) => t + (n[l] || 0), 0);
  const doneAll = a.levels.reduce((t, l) => t + Array.from({ length: n[l] || 0 }, (_, i) => done[`${l}-${i + 1}`] ? 1 : 0).reduce((x, y) => x + y, 0), 0);
  const cur = s.level && a.levels.includes(s.level) ? s.level : a.levels[0];
  // Same figure the app shows for each level (vocabulary, grammar, readings…), saved by the app; units otherwise.
  const lvp = s.lvp || {};
  const lp = l => { if (typeof lvp[l] === 'number') return lvp[l]; const t = n[l] || 0; if (!t) return 0; let d = 0; for (let i = 1; i <= t; i++) if (done[`${l}-${i}`]) d++; return Math.round(d / t * 100); };
  const pctAll = Math.round(a.levels.reduce((t, l) => t + lp(l), 0) / a.levels.length);
  const el = document.getElementById('l-' + a.id);
  if (!el) return;
  el.innerHTML = `
    <div class="lang-top"><span class="glyph">${esc(a.glyph)}</span>
      <div class="grow"><div class="lname">${esc(a.name)}</div><div class="lsub">${esc(a.native)} · nivel actual ${label(cur)}</div></div>
      <div class="pct">${pctAll}%</div></div>
    ${bar(pctAll)}
    <div class="stats"><span>📚 ${doneAll}/${total} unidades</span><span>🔥 ${s.streak || 0} días</span><span>⭐ ${s.xp || 0} XP</span></div>
    <div class="lvls" style="grid-template-columns:repeat(${a.levels.length},1fr)">${a.levels.map(l => `<div class="lvl ${l === cur ? 'cur' : ''}"><b>${short(l)}</b>${lp(l)}%<div class="mini"><i style="width:${lp(l)}%"></i></div></div>`).join('')}</div>
    <a class="btn" href="${a.path}">${started(a) ? 'Continuar' : 'Empezar'}</a>`;
}

$('#app').innerHTML = '<div class="note">Cargando…</div>';
</script>
</body>
</html>
